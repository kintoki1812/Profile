<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05070f">
    <meta name="color-scheme" content="dark">
    <title>Dolores</title>
    <meta name="description" content="Trung Tuan (Kintoki Nguyen) — liên kết mạng xã hội chính thức.">
    <link rel="icon" href="./trtuan.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ============================================================
           Cấu hình biến động cho animation xoay viền
           ============================================================ */
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* ============================================================
           BIẾN THIẾT KẾ — thay đổi theo breakpoint
           ============================================================ */
        :root {
            --card-w: 400px;
            --card-pad-top: 40px;
            --card-pad-x: 26px;
            --card-pad-bottom: 26px;
            --card-radius: 28px;

            --avatar-outer: 140px;
            --avatar-inner: 122px;
            --avatar-gap: 3px;

            --name-size: 28px;
            --nickname-size: 11px;
            --chip-size: 13px;
            --chip-pad-y: 10px;
            --chip-pad-x: 16px;
            --link-size: 14.5px;
            --link-pad-y: 11px;
            --link-pad-x: 16px;
            --link-icon: 40px;
            --link-icon-font: 17px;
            --link-icon-svg: 17px;
            --gap-links: 10px;
            --gap-chips: 8px;
        }

        /* Desktop lớn (≥ 1024px) */
        @media (min-width: 1024px) {
            :root {
                --card-w: 440px;
                --card-pad-top: 44px;
                --card-pad-x: 30px;
                --card-pad-bottom: 28px;
                --name-size: 30px;
                --link-size: 15px;
            }
        }

        /* Tablet (481–768px) */
        @media (max-width: 768px) and (min-width: 481px) {
            :root {
                --card-w: 380px;
            }
        }

        /* Điện thoại (≤ 480px) */
        @media (max-width: 480px) {
            :root {
                --card-w: 100%;
                --card-pad-top: 32px;
                --card-pad-x: 20px;
                --card-pad-bottom: 22px;
                --card-radius: 24px;

                --avatar-outer: 124px;
                --avatar-inner: 108px;

                --name-size: 24px;
                --nickname-size: 10px;
                --chip-size: 12px;
                --chip-pad-y: 9px;
                --chip-pad-x: 14px;
                --link-size: 14px;
                --link-icon: 36px;
                --link-icon-font: 15px;
                --link-icon-svg: 15px;
            }
        }

        /* Điện thoại nhỏ (≤ 360px) */
        @media (max-width: 360px) {
            :root {
                --card-pad-top: 26px;
                --card-pad-x: 16px;
                --card-pad-bottom: 20px;
                --avatar-outer: 108px;
                --avatar-inner: 94px;
                --name-size: 22px;
                --link-size: 13.5px;
                --link-pad-y: 10px;
                --link-pad-x: 14px;
                --gap-links: 8px;
                --gap-chips: 6px;
            }
        }

        /* Điện thoại xoay ngang (viewport thấp) */
        @media (max-height: 600px) and (orientation: landscape) {
            :root {
                --card-pad-top: 22px;
                --card-pad-bottom: 18px;
                --avatar-outer: 100px;
                --avatar-inner: 86px;
                --name-size: 22px;
                --gap-links: 8px;
            }
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 28px 16px;
            padding-top: max(28px, env(safe-area-inset-top));
            padding-right: max(16px, env(safe-area-inset-right));
            padding-bottom: max(28px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #ffffff;
            background: #05070f;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           AURORA BACKGROUND
           ============================================================ */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            will-change: transform;
        }

        .blob-1 {
            width: 480px;
            height: 480px;
            top: -160px;
            left: -140px;
            background: radial-gradient(circle, #22d3ee 0%, transparent 65%);
            animation: drift-1 22s ease-in-out infinite;
        }

        .blob-2 {
            width: 520px;
            height: 520px;
            bottom: -200px;
            right: -160px;
            background: radial-gradient(circle, #a78bfa 0%, transparent 65%);
            animation: drift-2 26s ease-in-out infinite;
        }

        .blob-3 {
            width: 380px;
            height: 380px;
            top: 40%;
            right: -140px;
            background: radial-gradient(circle, #f472b6 0%, transparent 65%);
            animation: drift-3 20s ease-in-out infinite;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 15%, transparent 72%);
            mask-image: radial-gradient(ellipse at center, #000 15%, transparent 72%);
        }

        /* ============================================================
           CARD — margin:auto để không bị clip khi overflow
           ============================================================ */
        .card {
            position: relative;
            z-index: 1;
            width: min(var(--card-w), 100%);
            margin: auto;
            padding: var(--card-pad-top) var(--card-pad-x) var(--card-pad-bottom);
            border-radius: var(--card-radius);
            text-align: center;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            backdrop-filter: blur(24px) saturate(140%);
            box-shadow:
                0 40px 90px -30px rgba(0, 0, 0, 0.85),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                0 1px 0 rgba(255, 255, 255, 0.09) inset;
            animation: card-in 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) both;
            isolation: isolate;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: conic-gradient(from var(--border-angle),
                    transparent 0deg,
                    #22d3ee 60deg,
                    #a78bfa 130deg,
                    #f472b6 200deg,
                    transparent 260deg,
                    transparent 360deg);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: rotate-border 6s linear infinite;
            opacity: 0.85;
        }

        .card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 25%;
            right: 25%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            pointer-events: none;
        }

        /* ============================================================
           AVATAR
           ============================================================ */
        .avatar-wrap {
            position: relative;
            width: var(--avatar-outer);
            height: var(--avatar-outer);
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
        }

        .avatar-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: var(--avatar-gap);
            background: conic-gradient(from 0deg, #22d3ee, #a78bfa, #f472b6, #22d3ee);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spin 8s linear infinite;
            filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.55));
        }

        .avatar-pulse {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(34, 211, 238, 0.45);
            animation: pulse 3.2s ease-out infinite;
            pointer-events: none;
        }

        .avatar {
            position: relative;
            z-index: 1;
            width: var(--avatar-inner);
            height: var(--avatar-inner);
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.14);
            background: #0a0e1a;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .avatar-wrap:hover .avatar {
            transform: scale(1.07) rotate(-3deg);
        }

        /* ============================================================
           TÊN & BIỆT DANH
           ============================================================ */
        .name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: var(--name-size);
            font-weight: 700;
            letter-spacing: -0.6px;
            margin: 0 0 8px;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 55%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nickname {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 0 0 22px;
            padding: 5px 14px;
            border-radius: 100px;
            font-size: var(--nickname-size);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(199, 210, 254, 0.9);
            background: rgba(165, 180, 252, 0.08);
            border: 1px solid rgba(165, 180, 252, 0.18);
        }

        .nickname::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22d3ee;
            box-shadow: 0 0 10px #22d3ee;
            animation: blink 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        /* ============================================================
           CHIP LIÊN HỆ
           ============================================================ */
        .chips {
            display: grid;
            gap: var(--gap-chips);
            margin-bottom: 24px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: var(--chip-pad-y) var(--chip-pad-x);
            border-radius: 100px;
            font-size: var(--chip-size);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            text-decoration: none;
            overflow-wrap: anywhere;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
            touch-action: manipulation;
        }

        .chip i {
            font-size: 12px;
            color: #22d3ee;
            flex-shrink: 0;
        }

        .chip:hover,
        .chip:focus-visible {
            background: rgba(34, 211, 238, 0.08);
            border-color: rgba(34, 211, 238, 0.35);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .chip:focus-visible {
            outline: 2px solid rgba(34, 211, 238, 0.7);
            outline-offset: 2px;
        }

        .chip:active {
            transform: translateY(0) scale(0.98);
            transition-duration: 0.1s;
        }

        /* ============================================================
           DANH SÁCH LINK
           ============================================================ */
        .links {
            display: grid;
            gap: var(--gap-links);
        }

        .link-btn {
            --brand: #ffffff;
            --fill: var(--brand);
            --fill-text: #ffffff;

            position: relative;
            display: grid;
            grid-template-columns: var(--link-icon) 1fr 20px;
            align-items: center;
            gap: 14px;
            padding: var(--link-pad-y) var(--link-pad-x) var(--link-pad-y) 11px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: var(--link-size);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.07);
            overflow: hidden;
            isolation: isolate;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
            animation: btn-in 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) both;
            touch-action: manipulation;
        }

        .link-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 55%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.14), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
            pointer-events: none;
            z-index: 0;
        }

        .link-btn:hover::before,
        .link-btn:focus-visible::before {
            left: 150%;
        }

        .link-btn .icon,
        .link-btn .label,
        .link-btn .arrow {
            position: relative;
            z-index: 1;
        }

        .link-btn .icon {
            display: grid;
            place-items: center;
            width: var(--link-icon);
            height: var(--link-icon);
            border-radius: 12px;
            font-size: var(--link-icon-font);
            color: var(--brand);
            background: color-mix(in srgb, var(--brand) 13%, transparent);
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .link-btn .icon svg {
            width: var(--link-icon-svg);
            height: var(--link-icon-svg);
        }

        .link-btn .label {
            text-align: left;
            letter-spacing: 0.1px;
        }

        .link-btn .arrow {
            justify-self: end;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            transform: translateX(-4px);
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .link-btn:hover,
        .link-btn:focus-visible {
            background: color-mix(in srgb, var(--brand) 9%, rgba(255, 255, 255, 0.03));
            border-color: color-mix(in srgb, var(--brand) 38%, transparent);
            transform: translateY(-3px);
            box-shadow: 0 18px 34px -18px color-mix(in srgb, var(--brand) 65%, transparent);
        }

        .link-btn:hover .icon,
        .link-btn:focus-visible .icon {
            color: var(--fill-text);
            background: var(--fill);
            transform: scale(1.06) rotate(-6deg);
            box-shadow: 0 0 22px color-mix(in srgb, var(--brand) 60%, transparent);
        }

        .link-btn:hover .arrow,
        .link-btn:focus-visible .arrow {
            color: #ffffff;
            transform: translateX(3px);
        }

        .link-btn:focus-visible {
            outline: 2px solid rgba(34, 211, 238, 0.7);
            outline-offset: 2px;
        }

        /* Tap feedback cho mobile */
        .link-btn:active {
            transform: translateY(-1px) scale(0.98);
            transition-duration: 0.1s;
        }

        /* Hiệu ứng xuất hiện lần lượt */
        .link-btn:nth-child(1) {
            animation-delay: 0.35s;
        }

        .link-btn:nth-child(2) {
            animation-delay: 0.42s;
        }

        .link-btn:nth-child(3) {
            animation-delay: 0.49s;
        }

        .link-btn:nth-child(4) {
            animation-delay: 0.56s;
        }

        .link-btn:nth-child(5) {
            animation-delay: 0.63s;
        }

        .link-btn:nth-child(6) {
            animation-delay: 0.70s;
        }

        /* ============================================================
           KEYFRAMES
           ============================================================ */
        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes btn-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes rotate-border {
            to {
                --border-angle: 360deg;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }

            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        @keyframes drift-1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(70px, 40px) scale(1.12);
            }

            66% {
                transform: translate(-40px, 80px) scale(0.94);
            }
        }

        @keyframes drift-2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-80px, -60px) scale(1.15);
            }
        }

        @keyframes drift-3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50px, -70px) scale(1.1);
            }
        }

        /* ============================================================
           TÔN TRỌNG GIẢM CHUYỂN ĐỘNG
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

        </nav>
    </main>
